<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#344c3d">
    <meta name="description" content="Side Quest recommends interesting things to try during your time at Dartmouth.">
    <title>Side Quest</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="nav-shell" aria-label="Primary navigation">
        <a class="wordmark nav-link" href="/" data-route="/" aria-label="Side Quest home">
          <span class="wordmark-mark" aria-hidden="true">SQ</span>
          <span>Side Quest</span>
        </a>
        <div class="nav-tabs">
          <a class="nav-link" href="/quests" data-route="/quests">My Quests</a>
          <a class="nav-link" href="/leaderboard" data-route="/leaderboard">Leaderboard</a>
          <a class="nav-link" href="/settings" data-route="/settings">Settings</a>
        </div>
      </nav>
    </header>
    <main id="main" class="page-shell" tabindex="-1">
      <div class="loading-state" role="status">
        <span class="loading-line"></span>
        <span class="loading-line short"></span>
        <span class="loading-line"></span>
        <span class="sr-only">Finding side quests…</span>
      </div>
    </main>
    <div id="announcer" class="sr-only" aria-live="polite"></div>

    <script src="/js/catalog.js"></script>
    <script src="/js/recommendations.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
